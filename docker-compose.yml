
services:
  postgres:
    image: postgres:17
    container_name: pulsecrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsecrm
      POSTGRES_PASSWORD: pulsecrm_dev_2026
      POSTGRES_DB: pulsecrm
    ports:
      - "5433:5432"
    volumes:
      - pulsecrm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsecrm -d pulsecrm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulsecrm_data:
